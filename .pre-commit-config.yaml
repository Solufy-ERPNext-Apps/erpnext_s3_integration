exclude: 'node_modules|.git'
default_stages: [commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        files: "erpnext_s3_integration.*"
        exclude: ".*json$|.*txt$|.*csv$|.*md$|.*svg$"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        exclude: |
          (?x)^(
            erpnext_s3_integration/public/dist/.*|
            .*node_modules.*|
            .*boilerplate.*|
            erpnext_s3_integration/templates/includes/.*|
            erpnext_s3_integration/public/js/lib/.*
          )$

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.2.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        exclude: |
          (?x)^(
            erpnext_s3_integration/public/dist/.*|
            cypress/.*|
            .*node_modules.*|
            .*boilerplate.*|
            erpnext_s3_integration/templates/includes/.*|
            erpnext_s3_integration/public/js/lib/.*
          )$

  - repo: https://github.com/returntocorp/semgrep
    rev: v1.89.0
    hooks:
      - id: semgrep
        name: "Run Semgrep custom rules"
        language_version: python3.12
        args: ['--config', '.semgrep.yml', '--config', 'semgrep_frappe_rules', '--error']

ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false